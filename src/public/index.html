<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroViz — DICOM Brain Visualization</title>

  <!-- Tailwind CDN (play) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HTMX v2 -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>

  <!-- Alpine.js v3 -->
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/public/css/app.css" />
</head>
<body x-data="neuroviz()" x-init="init()">

  <div class="app-layout">

    <!-- ═══════════════ Header ═══════════════ -->
    <header class="app-header">
      <h1>NEUROVIZ</h1>
      <span class="version">v1.0</span>
      <div class="flex-1"></div>
      <div id="dwv-status" class="text-[11px] text-zinc-500">Ready</div>
      <div class="flex items-center gap-1">
        <div id="dwv-progress-text" class="text-[10px] text-zinc-600 w-8 text-right"></div>
        <div class="progress-container w-24">
          <div id="dwv-progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <!-- ═══════════════ Left Panel ═══════════════ -->
    <aside class="panel-left">

      <!-- Upload / Drop Zone -->
      <div class="panel-section">
        <div class="panel-section-title">Data Source</div>

        <div id="dropzone"
             x-on:dragover.prevent="$el.classList.add('drag-over')"
             x-on:dragleave.prevent="$el.classList.remove('drag-over')"
             x-on:drop.prevent="handleDrop($event)"
             x-on:click="$refs.fileInput.click()">
          <div class="icon">&#x1F9E0;</div>
          <div class="label">Drop .dcm files or click to browse</div>
          <div class="text-[10px] text-zinc-600 mt-1" id="file-count" x-text="fileCountText"></div>
        </div>

        <form id="upload-form"
              hx-post="/upload"
              hx-encoding="multipart/form-data"
              hx-target="#metadata-panel"
              hx-swap="innerHTML"
              hx-indicator="#upload-loader"
              style="display:none">
          <input type="file" name="files" multiple accept=".dcm,.DCM"
                 x-ref="fileInput"
                 x-on:change="handleFileSelect($event)" />
          <input type="hidden" name="sessionId" x-bind:value="sessionId" />
        </form>

        <!-- SSE progress -->
        <div id="upload-progress" x-show="uploading" class="mt-2">
          <div class="progress-container">
            <div class="progress-bar" x-bind:style="'width:' + uploadPct + '%'"></div>
          </div>
          <div class="text-[10px] text-zinc-500 mt-1" x-text="uploadMsg"></div>
        </div>

        <div id="upload-loader" class="htmx-indicator">
          <div class="text-[10px] text-cyan-400 animate-pulse-glow mt-2">Processing...</div>
        </div>

        <!-- Re-upload button (shown after data is loaded) -->
        <button class="btn w-full mt-3 justify-center" x-show="volumeLoaded"
                x-on:click="location.reload()">
          Load New Data
        </button>
      </div>

      <!-- Metadata Panel -->
      <div class="panel-section">
        <div class="panel-section-title">Metadata</div>
        <div id="metadata-panel" class="text-xs text-zinc-500">
          No data loaded
        </div>
      </div>

    </aside>

    <!-- ═══════════════ 3D Viewport ═══════════════ -->
    <main class="viewport-3d" id="three-canvas">
      <!-- Three.js renders here -->
      <div class="viewport-overlay" id="render-stats" x-text="renderInfo"></div>

      <!-- Empty state -->
      <div id="empty-state" x-show="!volumeLoaded"
           class="absolute inset-0 flex items-center justify-center">
        <div class="text-center">
          <div class="text-4xl opacity-20 mb-3">&#x1F9E0;</div>
          <div class="text-zinc-600 text-sm">Load DICOM data to visualize</div>
          <div class="text-zinc-700 text-[10px] mt-1">Volumetric ray-marching renderer</div>
        </div>
      </div>
    </main>

    <!-- ═══════════════ Right Panel ═══════════════ -->
    <aside class="panel-right">

      <!-- Rendering Controls -->
      <div class="panel-section">
        <div class="panel-section-title">Rendering</div>

        <div class="space-y-3">
          <!-- Colormap -->
          <div>
            <label class="text-[10px] text-zinc-500 uppercase tracking-wider">Colormap</label>
            <select name="colormap"
                    hx-get="/panel/colormap"
                    hx-trigger="change"
                    hx-target="#colormap-preview"
                    x-on:change="brain3d?.setColormap($event.target.value)">
              <option value="hot">Hot</option>
              <option value="plasma">Plasma</option>
              <option value="viridis">Viridis</option>
              <option value="gray">Gray</option>
              <option value="pet">PET</option>
            </select>
            <div id="colormap-preview" class="mt-2">
              <div class="h-3 rounded" style="background: linear-gradient(90deg, #000, #f00, #ff0, #fff)"></div>
              <div class="flex justify-between text-[10px] text-zinc-500 mt-1">
                <span>0</span>
                <span class="text-zinc-400 uppercase tracking-wider">hot</span>
                <span>max</span>
              </div>
            </div>
          </div>

          <!-- Threshold -->
          <div>
            <div class="flex justify-between">
              <label class="text-[10px] text-zinc-500 uppercase tracking-wider">Threshold</label>
              <span class="text-[10px] text-zinc-600" x-text="(threshold * 100).toFixed(0) + '%'"></span>
            </div>
            <input type="range" min="0" max="100" x-bind:value="threshold * 100"
                   x-on:input="threshold = $event.target.value / 100; brain3d?.setThreshold(threshold)" />
          </div>

          <!-- Opacity -->
          <div>
            <div class="flex justify-between">
              <label class="text-[10px] text-zinc-500 uppercase tracking-wider">Opacity</label>
              <span class="text-[10px] text-zinc-600" x-text="(opacity * 100).toFixed(0) + '%'"></span>
            </div>
            <input type="range" min="1" max="100" x-bind:value="opacity * 100"
                   x-on:input="opacity = $event.target.value / 100; brain3d?.setOpacity(opacity * 0.1)" />
          </div>

          <!-- Steps -->
          <div>
            <div class="flex justify-between">
              <label class="text-[10px] text-zinc-500 uppercase tracking-wider">Ray Steps</label>
              <span class="text-[10px] text-zinc-600" x-text="steps"></span>
            </div>
            <input type="range" min="32" max="512" step="32" x-bind:value="steps"
                   x-on:input="steps = parseInt($event.target.value); brain3d?.setSteps(steps)" />
          </div>

          <!-- Window / Level -->
          <div>
            <div class="flex justify-between">
              <label class="text-[10px] text-zinc-500 uppercase tracking-wider">Window Center</label>
              <span class="text-[10px] text-zinc-600" x-text="windowCenter.toFixed(2)"></span>
            </div>
            <input type="range" min="0" max="100" x-bind:value="windowCenter * 100"
                   x-on:input="windowCenter = $event.target.value / 100; brain3d?.updateWindowLevel(windowCenter, windowWidth)" />
          </div>
          <div>
            <div class="flex justify-between">
              <label class="text-[10px] text-zinc-500 uppercase tracking-wider">Window Width</label>
              <span class="text-[10px] text-zinc-600" x-text="windowWidth.toFixed(2)"></span>
            </div>
            <input type="range" min="1" max="100" x-bind:value="windowWidth * 100"
                   x-on:input="windowWidth = $event.target.value / 100; brain3d?.updateWindowLevel(windowCenter, windowWidth)" />
          </div>
        </div>
      </div>

      <!-- Slice Controls -->
      <div class="panel-section">
        <div class="panel-section-title">Slice Position</div>

        <div class="space-y-2">
          <div>
            <label class="text-[10px] text-zinc-500">Axial (X)</label>
            <input type="range" name="slice-x" min="0" max="100" value="50"
                   hx-get="/slices"
                   hx-trigger="input changed delay:50ms"
                   hx-include="[name='slice-y'],[name='slice-z']"
                   hx-target="#slice-stats"
                   x-on:input="brain3d?.setSliceX($event.target.value / 100)" />
          </div>
          <div>
            <label class="text-[10px] text-zinc-500">Sagittal (Y)</label>
            <input type="range" name="slice-y" min="0" max="100" value="50"
                   hx-get="/slices"
                   hx-trigger="input changed delay:50ms"
                   hx-include="[name='slice-x'],[name='slice-z']"
                   hx-target="#slice-stats"
                   x-on:input="brain3d?.setSliceY($event.target.value / 100)" />
          </div>
          <div>
            <label class="text-[10px] text-zinc-500">Coronal (Z)</label>
            <input type="range" name="slice-z" min="0" max="100" value="50"
                   hx-get="/slices"
                   hx-trigger="input changed delay:50ms"
                   hx-include="[name='slice-x'],[name='slice-y']"
                   hx-target="#slice-stats"
                   x-on:input="brain3d?.setSliceZ($event.target.value / 100)" />
          </div>
        </div>

        <div id="slice-stats" class="mt-2">
          <div class="grid grid-cols-3 gap-2 text-xs font-mono">
            <div class="bg-zinc-800/50 rounded px-2 py-1">
              <span class="text-zinc-500">X</span>
              <span class="text-cyan-400 ml-1">50</span>
            </div>
            <div class="bg-zinc-800/50 rounded px-2 py-1">
              <span class="text-zinc-500">Y</span>
              <span class="text-cyan-400 ml-1">50</span>
            </div>
            <div class="bg-zinc-800/50 rounded px-2 py-1">
              <span class="text-zinc-500">Z</span>
              <span class="text-cyan-400 ml-1">50</span>
            </div>
          </div>
        </div>
      </div>

      <!-- DWV Tools -->
      <div class="panel-section">
        <div class="panel-section-title">DWV Tools</div>
        <div class="flex gap-2 flex-wrap">
          <button class="tool-btn" x-bind:class="{'active': activeTool === 'Scroll'}"
                  x-on:click="setDwvTool('Scroll')">Scroll</button>
          <button class="tool-btn" x-bind:class="{'active': activeTool === 'WindowLevel'}"
                  x-on:click="setDwvTool('WindowLevel')">W/L</button>
          <button class="tool-btn" x-bind:class="{'active': activeTool === 'ZoomAndPan'}"
                  x-on:click="setDwvTool('ZoomAndPan')">Zoom</button>
        </div>
      </div>

      <!-- Camera Presets -->
      <div class="panel-section">
        <div class="panel-section-title">Camera</div>
        <div class="flex gap-2 flex-wrap">
          <button class="tool-btn" x-on:click="brain3d?.animateCamera(0, Math.PI/2, 2.2)">Front</button>
          <button class="tool-btn" x-on:click="brain3d?.animateCamera(Math.PI/2, Math.PI/2, 2.2)">Side</button>
          <button class="tool-btn" x-on:click="brain3d?.animateCamera(0, 0.01, 2.2)">Top</button>
          <button class="tool-btn" x-on:click="brain3d?.animateCamera(0.5, Math.PI/4, 2.2)">Iso</button>
        </div>
      </div>

    </aside>

    <!-- ═══════════════ 2D Viewports (bottom) ═══════════════ -->
    <div class="viewport-2d">
      <div class="dwv-viewport">
        <span class="label">Axial</span>
        <div id="dwv-axial" style="width:100%;height:100%"></div>
      </div>
      <div class="dwv-viewport">
        <span class="label">Sagittal</span>
        <div id="dwv-sagittal" style="width:100%;height:100%"></div>
      </div>
      <div class="dwv-viewport">
        <span class="label">Coronal</span>
        <div id="dwv-coronal" style="width:100%;height:100%"></div>
      </div>
    </div>

  </div>

  <!-- ═══════════════ App Script (bundled) ═══════════════ -->
  <script src="/public/js/app.js"></script>

  <script>
    function neuroviz() {
      return {
        brain3d: null,
        dwvCtrl: null,
        sessionId: crypto.randomUUID().slice(0, 8),
        volumeLoaded: false,
        uploading: false,
        uploadPct: 0,
        uploadMsg: '',
        fileCountText: '',
        renderInfo: '',
        activeTool: 'Scroll',

        // Rendering params
        threshold: 0.1,
        opacity: 0.3,
        steps: 256,
        windowCenter: 0.5,
        windowWidth: 1.0,

        pendingFiles: null,

        init() {
          // Wait for ES modules to load
          const check = setInterval(() => {
            if (window.Brain3D && window.DwvController) {
              clearInterval(check);
              this._setup();
            }
          }, 100);
        },

        _setup() {
          // Init Three.js
          const container = document.getElementById('three-canvas');
          this.brain3d = new window.Brain3D(container);

          // Init DWV
          this.dwvCtrl = new window.DwvController();

          // Wire DWV → Three.js
          this.dwvCtrl.onVolume((data, sx, sy, sz) => {
            this.brain3d.loadVolume(data, sx, sy, sz);
            this.volumeLoaded = true;
            this.renderInfo = `${sx}×${sy}×${sz} voxels`;
          });

          this.dwvCtrl.onWLChange((center, width) => {
            // Normalize to 0-1 range
            this.brain3d.updateWindowLevel(center / 65535, width / 65535);
          });

          // SSE for upload progress
          this._connectSSE();

          // Listen for volume-loaded
          window.addEventListener('volume-loaded', (e) => {
            this.volumeLoaded = true;
          });
        },

        _connectSSE() {
          const es = new EventSource(`/sse/progress/${this.sessionId}`);
          es.onmessage = (e) => {
            try {
              const data = JSON.parse(e.data);
              this.uploadPct = data.pct;
              this.uploadMsg = data.message || '';
              if (data.pct >= 95) {
                this.uploading = false;
                es.close();
              }
            } catch {}
          };
          es.onerror = () => {
            es.close();
            this.uploading = false;
          };
        },

        handleDrop(event) {
          event.target.classList?.remove('drag-over');
          const files = Array.from(event.dataTransfer.files);
          const dcmFiles = files.filter(f => f.name.endsWith('.dcm') || f.name.endsWith('.DCM'));
          if (dcmFiles.length === 0) return;

          this.fileCountText = `${dcmFiles.length} files selected`;
          this.pendingFiles = dcmFiles;

          // Upload via HTMX form
          this._uploadFiles(dcmFiles);

          // Also load into DWV directly for 2D views and volume extraction
          this.dwvCtrl?.loadFromFiles(dcmFiles);
        },

        handleFileSelect(event) {
          const files = Array.from(event.target.files);
          const dcmFiles = files.filter(f => f.name.endsWith('.dcm') || f.name.endsWith('.DCM'));
          if (dcmFiles.length === 0) return;

          this.fileCountText = `${dcmFiles.length} files selected`;
          this.pendingFiles = dcmFiles;

          this._uploadFiles(dcmFiles);
          this.dwvCtrl?.loadFromFiles(dcmFiles);
        },

        _uploadFiles(files) {
          this.uploading = true;
          this.uploadPct = 0;
          this._connectSSE();

          const formData = new FormData();
          formData.append('sessionId', this.sessionId);
          files.forEach(f => formData.append('files', f));

          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/upload');
          xhr.onload = () => {
            if (xhr.status === 200) {
              document.getElementById('metadata-panel').innerHTML = xhr.responseText;
            }
            this.uploading = false;
          };
          xhr.onerror = () => {
            this.uploading = false;
            this.uploadMsg = 'Upload failed';
          };
          xhr.send(formData);
        },

        setDwvTool(name) {
          this.activeTool = name;
          this.dwvCtrl?.setTool(name);
        }
      };
    }
  </script>

</body>
</html>
