target-version = "py312"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "C4", "SIM", "RUF"]
# N813/N814: SimpleITK as sitk, Path as _P, DataLoader as _DL are universal conventions
# N806: module-level constants (ALL_CAPS) used inside functions are intentional
# N8xx: camelcase import aliases and Tesla-unit field names are domain conventions
ignore = ["N813", "N814", "N806", "N803", "N815"]

[lint.per-file-ignores]
"tests/*" = ["F401", "S101", "B011"]
"**/conftest.py" = ["F401"]
# E402: deferred imports after sys.path manipulation or __future__ guards
"main.py" = ["E402"]
"src/extraction.py" = ["E402"]
"tests/test_confidence_summary.py" = ["E402"]
"tests/test_io_msgspec.py" = ["E402"]
"tests/test_lance_slice_dataset.py" = ["E402"]
"tests/test_series_zarr.py" = ["E402"]
"tests/test_slice_zarr.py" = ["E402"]
"tests/test_tensorstore_reader.py" = ["E402"]
"tests/test_zarr_export.py" = ["E402"]
# E501: long lines in annotation/reporting files with unavoidable long strings
"src/annotation/cloud.py" = ["E501", "RUF001", "RUF002"]
"src/annotation/local.py" = ["E501", "RUF001", "RUF002"]
"src/report.py" = ["E501"]
"src/qc/per_study.py" = ["E501", "RUF001"]
"src/qc/dataset.py" = ["E501", "RUF001", "RUF003"]
"src/cli.py" = ["E501"]
"src/loaders/monai.py" = ["E501"]
"src/pipeline/commercial.py" = ["E501"]
"src/qc/badge.py" = ["E501"]
"modal_app.py" = ["E501"]
"batch_pipeline.py" = ["E501"]
"resume_pipeline.py" = ["E501"]
"upload_to_hf.py" = ["E501"]
"upload_hf.py" = ["E501"]
"upload_hf_clean.py" = ["E501"]
"upload_from_modal.py" = ["E501"]
"generate_pdf.py" = ["E501", "RUF001"]
"extract_sample.py" = ["E501"]
"Speall_MRI_Samples/run_ai.py" = ["E501"]
"src/display.py" = ["E501"]
"src/hipaa.py" = ["E501"]
"src/pipeline/reporting.py" = ["E501"]
"src/pipeline/process.py" = ["E501"]
"src/pipeline/parquet_convert.py" = ["E501"]
"src/pipeline/save.py" = ["E501", "RUF001"]
"src/manifest/pandera_schemas.py" = ["E501"]
"src/loaders/pytorch.py" = ["E501"]
"tests/test_call_model_retry.py" = ["E501", "RUF002"]
# notebooks: E402 for path-setup cells, E501 for long outputs
"notebooks/01_cohort_filtering.py" = ["E402", "E501"]
"notebooks/02_pytorch_training_loop.py" = ["E402", "E501"]
"notebooks/03_monai_segmentation.py" = ["E402", "E501"]
# RUF001/002/003: intentional Unicode chars (x for multiplication, -- for en-dash)
"src/exports.py" = ["RUF003"]
"src/hf_upload.py" = ["RUF001"]
"src/pipeline/discover.py" = ["RUF002"]
"src/pipeline/mcap_convert.py" = ["RUF001", "RUF002"]
"src/pipeline/plan.py" = ["RUF002", "RUF003"]
"src/redaction.py" = ["RUF002"]
"src/series.py" = ["E402", "RUF003"]
"src/validation/pixel_phi.py" = ["RUF003"]

[format]
quote-style = "double"
