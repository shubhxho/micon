[project]
name = "micom"
version = "5.0.0"
description = "DICOM medical imaging extraction, analysis, HIPAA redaction, and Hugging Face dataset publishing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "pydicom>=3.0",
    "SimpleITK>=2.5",
    "dicom2nifti>=2.6",
    "nibabel>=5.3",
    "polars>=1.39",
    "numpy>=2.4",
    "rich>=15.0",
    "typer>=0.24",
    "cyclopts>=3.0",
    "openai>=2.0",
    "httpx>=0.28",
    "matplotlib>=3.10",
    "scipy>=1.17",
    "pillow>=12.0",
    "python-dotenv>=1.2",
    "mlx>=0.31",
    "modal>=1.4",
    "huggingface_hub>=1.0",
    "cupy-cuda12x>=13.0; platform_machine == 'x86_64'",
    "pydeface>=2.0.2",
    "pytesseract>=0.3.13",
    "cryptography>=47.0.0",
    "webdataset>=1.0.2",
    "scikit-learn>=1.7",
    "pandera[polars]>=0.31",
    "msgspec>=0.21",
    "orjson>=3.10",
    "jsonschema>=4.26",
    "zarr>=3.0",
    "ome-zarr>=0.16",
    "numcodecs>=0.16",
    "scikit-image>=0.26",
    "monai>=1.5",
    "loguru>=0.7",
    "stamina>=25.1",
    "tenacity>=9.0",
    "pylance>=0.20",
    "tensorstore>=0.1.65",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
monai = ["monai>=1.4", "torch>=2.4", "nibabel>=5.3"]
dl = ["torch>=2.4", "monai>=1.4", "nibabel>=5.3"]

[project.scripts]
speall = "src.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: mark test as slow (deselect with -m 'not slow')",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "pre-commit>=4.0",
    "pyarrow>=24.0.0",
]
