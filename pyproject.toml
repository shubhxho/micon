[project]
name = "micom"
version = "5.0.0"
description = "DICOM medical imaging extraction, analysis, HIPAA redaction, and Hugging Face dataset publishing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "pydicom>=3.0",
    "SimpleITK>=2.4",
    "nibabel>=5.3",
    "polars>=1.17",
    "numpy>=2.1",
    "rich>=13.9",
    "typer>=0.15",
    "openai>=1.50",
    "matplotlib>=3.10",
    "scipy>=1.14",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "mlx>=0.22",
    "modal>=1.4",
    "huggingface_hub>=0.25",
    "cupy-cuda12x>=13.0; platform_machine == 'x86_64'",
    "pydeface>=2.0.2",
    "pytesseract>=0.3.13",
    "cryptography>=47.0.0",
    "webdataset>=1.0.2",
]

[project.scripts]
speall = "src.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
